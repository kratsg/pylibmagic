ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/psf/black
    rev: "b0d1fba7ac3be53c71fb0d3211d911e629f8aecb" # frozen: 23.1.0 (held back: 26.5.1 reformats src/pylibmagic/__init__.py)
    hooks:
      - id: black-jupyter

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        exclude: mkdocs.yml
      - id: check-yaml
        name: check-yaml (unsafe)
        files: mkdocs.yml
        args: ["--unsafe"]
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316" # frozen: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "6f3cb139ef36133b6f903b97facc57b07cef57c9" # frozen: v3.0.0-alpha.6 (held back: archived repo, newer tags are alphas)
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]

  - repo: https://github.com/asottile/blacken-docs
    rev: "fda77690955e9b63c6687d8806bafd56a526e45f" # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==22.8.0]

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: e812d61e6e9d269f44ecda63904ed670a1948fe8 # frozen: v0.0.257 (held back: v0.16.1 flags/autofixes tests/test_import.py, tests/test_compiled.py)
    hooks:
      - id: ruff
        args: ["--fix", "--show-fixes"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "41e691678310dfd3833f7ab4e180ddb014310356" # frozen: v2.3.0
    hooks:
      - id: mypy
        files: src
        args: []
        additional_dependencies: ["importlib_resources"]

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        exclude: cards
        args: ["-w", "-L", "hist"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "745eface02aef23e168a8afb6b5737818efbea95" # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa # frozen: v1.29.0
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=pedantic]

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest
        exclude: .pre-commit-config.yaml

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: f4d7745e17a28aad7eed2f4874ca8d1568c11c4c # frozen: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
